# Builds MapMatcher for Windows, Linux and macOS (Apple silicon and Intel).
# On a v* tag the four downloads are attached to that tag's GitHub release;
# run by hand (workflow_dispatch) it only builds, and the files are kept as
# workflow artifacts.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/MapMatcher.Tests -c Release

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from the tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - name: Publish (one self-contained exe)
        shell: bash
        run: dotnet publish MapMatcher.csproj -c Release -r win-x64 -o out $VERSION_ARG
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/MapMatcher.exe
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - name: Publish (one self-contained executable)
        run: dotnet publish MapMatcher.csproj -c Release -r linux-x64 -o out/MapMatcher $VERSION_ARG
      - name: Pack MapMatcher-linux-x64.tar.gz
        run: |
          rm -f out/MapMatcher/*.pdb
          cp LICENSE out/MapMatcher/
          cp Assets/icon-256.png out/MapMatcher/mapmatcher.png
          chmod +x out/MapMatcher/MapMatcher
          tar -C out -czf MapMatcher-linux-x64.tar.gz MapMatcher
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: MapMatcher-linux-x64.tar.gz
          if-no-files-found: error

  macos:
    needs: test
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            arch: arm64
          - rid: osx-x64
            arch: x64
    # an Apple silicon runner builds both: codesign only exists on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "VERSION_ARG=-p:Version=$VERSION" >> "$GITHUB_ENV"
          else
            VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' MapMatcher.csproj)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish (self-contained folder)
        run: dotnet publish MapMatcher.csproj -c Release -r ${{ matrix.rid }} -o out $VERSION_ARG
      - name: Build MapMatcher.app
        run: |
          APP=MapMatcher.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R out/. "$APP/Contents/MacOS/"
          rm -f "$APP/Contents/MacOS/"*.pdb
          chmod +x "$APP/Contents/MacOS/MapMatcher"
          sed "s/\${VERSION}/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"

          # icon: every size iconutil knows that 256 px can give
          ICONSET=MapMatcher.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 128 256; do
            sips -z $size $size Assets/icon-256.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            if [ $double -le 256 ]; then
              sips -z $double $double Assets/icon-256.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
            fi
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/MapMatcher.icns"
      - name: Sign (ad hoc)
        # Apple silicon refuses to run code that carries no signature at all.
        # Each file first, then the bundle, as Avalonia's macOS guide does. Not the main executable on its own:
        # signing it signs the bundle, which needs every other file signed already.
        run: |
          APP=MapMatcher.app
          find "$APP/Contents/MacOS" -type f ! -path "$APP/Contents/MacOS/MapMatcher" | while read -r file; do
            codesign --force --timestamp=none --sign - "$file"
          done
          codesign --force --timestamp=none --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"
      - name: Zip MapMatcher-macos-${{ matrix.arch }}.zip
        run: ditto -c -k --sequesterRsrc --keepParent MapMatcher.app "MapMatcher-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: MapMatcher-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
